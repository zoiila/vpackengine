<path d="M197 388H481" stroke="#84C9DD" stroke-width="3"/>
<text x="224" y="430" font-size="20" font-weight="750" fill="#84C9DD">01</text>
<text x="224" y="473" font-size="25" font-weight="740" fill="#F8F7FC">IMPORT</text>
<circle cx="339" cy="487" r="8" fill="#84C9DD" stroke="#192F3D" stroke-width="3"/>
<text x="224" y="548" font-size="18" fill="#BEC9D6">Bring an existing pack</text>
<text x="224" y="579" font-size="18" fill="#BEC9D6">into the managed library.</text>
</g><g>
<rect x="513" y="388" width="284" height="234" rx="5" fill="#192F3D" stroke="#475E70" stroke-width="1.6"/>
<path d="M513 388H797" stroke="#84C9DD" stroke-width="3"/>
<text x="540" y="430" font-size="20" font-weight="750" fill="#84C9DD">02</text>
<text x="540" y="473" font-size="25" font-weight="740" fill="#F8F7FC">VALIDATE</text>
<circle cx="655" cy="487" r="8" fill="#84C9DD" stroke="#192F3D" stroke-width="3"/>
<text x="540" y="548" font-size="18" fill="#BEC9D6">Check and version</text>
<text x="540" y="579" font-size="18" fill="#BEC9D6">the pack before use.</text>
</g><g>
<rect x="829" y="388" width="284" height="234" rx="5" fill="#192F3D" stroke="#475E70" stroke-width="1.6"/>
<path d="M829 388H1113" stroke="#84C9DD" stroke-width="3"/>
<text x="856" y="430" font-size="20" font-weight="750" fill="#84C9DD">03</text>
<text x="856" y="473" font-size="25" font-weight="740" fill="#F8F7FC">ACTIVATE</text>
<circle cx="971" cy="487" r="8" fill="#84C9DD" stroke="#192F3D" stroke-width="3"/>
<text x="856" y="548" font-size="18" fill="#BEC9D6">Select the approved</text>
<text x="856" y="579" font-size="18" fill="#BEC9D6">pack profile.</text>
</g><g>
<rect x="1145" y="388" width="284" height="234" rx="5" fill="#192F3D" stroke="#475E70" stroke-width="1.6"/>
<path d="M1145 388H1429" stroke="#F3C47A" stroke-width="3"/>
<text x="1172" y="430" font-size="20" font-weight="750" fill="#84C9DD">04</text>
