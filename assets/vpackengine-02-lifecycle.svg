<text x="194" y="167" font-size="20" font-weight="750" letter-spacing="2.2" fill="#84C9DD">02 / DELIVERY LIFECYCLE</text>
<text x="193" y="262" font-size="63" font-weight="745" letter-spacing="-2.1" fill="#F8F7FC">From pack to player.</text>
<text x="197" y="309" font-size="25" fill="#BDC7D3">An explicit workflow for assets your server already uses.</text>
