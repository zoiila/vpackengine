<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="790" viewBox="0 0 1680 790" role="img" aria-label="The boundary is intentional.. Resource packs personalize the client. Gameplay remains server logic."><title>The boundary is intentional.</title>
<path d="M134 131L211 80H459" stroke="#456F85" stroke-width="2.4" fill="none" opacity=".5"/>
<g transform="rotate(-.42 835 395)">
<rect x="137" y="114" width="1418" height="624" rx="7" fill="#06141E" opacity=".42"/>
<rect x="125" y="102" width="1418" height="624" rx="6" fill="#273B4A" opacity=".88"/>
